# Config for external/runpod's scripts/runpod/create_pods.sh — the
# bge-m3-zeroshot NLI pod (same generic external/runpod/docker/nli-runpod/
# image as input/nli_pods.conf, built with a different --build-arg
# NLI_MODEL and pushed under a different tag — see TD_BM_NLI_approach.qmd).
# Pairs with input/config.yaml's nli.configs.bge_m3_zeroshot (granularity:
# complete_bm), whose max_length: 2048 assumes this pod is actually running
# MoritzLaurer/bge-m3-zeroshot-v2.0-c, not the default deberta model.
#
# NOT provisioned yet — this file documents the launch recipe so it's one
# deliberate step away when actually trying complete_bm/bge_m3_zeroshot,
# not something run automatically. Building/pushing the image and running
# create_pods.sh both cost real money/time and need explicit go-ahead.
#
# Usage (once the image below has actually been built and pushed):
#   export RUNPOD_API_KEY=...
#   external/runpod/scripts/runpod/create_pods.sh -n 1 -c input/nli_pods_bge_m3.conf
#
# Start with -n 1 and measure real throughput/memory at this model's much
# longer (up to max_length: 2048) sequences before deciding how many hosts
# nli.configs.bge_m3_zeroshot.host should actually list -- unlike
# deberta_zeroshot's proven 7-host pool, there's no measured basis yet for
# sizing this one.
#
# RUNPOD_API_KEY is NOT set here — export it in your shell before running the
# script. It authenticates the pod-creation API call itself (this always needs
# the raw key — RunPod Secrets are substituted inside a running pod, not in
# requests to create one).

# Build once (from repo root), before this config is ever used:
#   cd external/runpod
#   make docker-nli-bge-m3 REGISTRY=ghcr.io/rkrug VERSION=v0.4.0
#
# (The image has its own docker/nli-runpod-bge-m3/ directory and its own
# Makefile target. An earlier version of this comment said to build
# docker/nli-runpod/Dockerfile with --build-arg NLI_MODEL=... -- that predates
# the dedicated directory and would build the WRONG image's Dockerfile under
# this image's tag.)
IMAGE="ghcr.io/rkrug/nli-runpod-bge-m3:v0.4.0"

# GPU type id exactly as RunPod expects it. bge-m3-zeroshot-v2.0-c is a
# larger model (~568M params vs. deberta-v3-large's ~435M) processing much
# longer sequences (max_length: 2048 vs. 512), so throughput is a thing to
# actually measure, not assume, once a pod is running.
#
# NOTE: there is no REST API endpoint to list current GPU availability --
# confirmed directly (GET /v1/gpuTypes returns a spec-validation error; the
# real REST API surface has no gpu-related path at all, verified against its
# own /v1/openapi.json, which lists 23 paths total, none GPU-related). The
# authoritative list of valid id STRINGS (not live availability, just valid
# values) is PodCreateInput.properties.gpuTypeIds.items.enum in that same
# openapi.json -- fetch it directly:
#   curl -s https://rest.runpod.io/v1/openapi.json | \
#     jq -r '.components.schemas.PodCreateInput.properties.gpuTypeIds.items.enum[]'
# Live availability can only actually be discovered by trying to create a
# pod with a given id and seeing whether it succeeds (or checking the
# RunPod web console's own GPU picker) -- confirmed L4 was unavailable in
# this project's SECURE cloud tier at least once already; NVIDIA L40S (48GB,
# same Ada Lovelace generation as L4, substantially more compute) is the
# real, valid fallback actually used for that run.
GPU_TYPE_ID="NVIDIA L4"
# GPU_TYPE_ID="NVIDIA L40S"
GPU_COUNT=1

# HTTP service exposed through RunPod's proxy at
# https://<pod-id>-8080.proxy.runpod.net (matches NLI_PORT in the Dockerfile).
POD_KIND="http"
PORT=8080
HEALTH_PATH="/health"

# Disk sizing (GB). The model is baked into the image, so volume storage is
# mostly headroom, not required for correctness. bge-m3 is a larger model
# than deberta-v3-large -- bump the image/container disk allowance if the
# build or boot fails on space.
CONTAINER_DISK_GB=15
VOLUME_GB=0
VOLUME_MOUNT_PATH="/workspace"

# RunPod cloud tier: SECURE (RunPod-operated DCs) or COMMUNITY (cheaper, less
# guaranteed availability).
CLOUD_TYPE="SECURE"

# Name prefix; pods are named "nli-runpod-bge-m3-<timestamp>-01" etc.
POD_NAME_PREFIX="nli-runpod-bge-m3"

# Idle watchdog settings, passed into each pod's environment.
#
# IDLE_MIN counts only AFTER a pod has served its first request (see
# external/runpod/docker/nli-runpod-bge-m3/nli_idle_watchdog.sh). Before that,
# STARTUP_GRACE_MIN applies instead -- which is what makes a 10-pod bring-up
# safe: the earliest pods are no longer counting down while the rest boot, while
# their hostnames are collected, and while tar_make() starts. Only POST
# /classify moves the counter the watchdog watches; create_pods.sh's own
# /health polling does NOT.
#
# REQUIRES IMAGE >= v0.4.0 (pinned above). v0.1.0 - v0.3.0 all have the old
# single-timer watchdog, which ignores STARTUP_GRACE_MIN and starts IDLE_MIN at
# model-ready. Note v0.3.0 sorts ABOVE the fix's first build (v0.2.0), which is
# why the fix was republished as v0.4.0. Pod env vars are fixed at creation
# time, so adopting this means CREATING new pods, not restarting existing ones.
#
# With the race gone, IDLE_MIN no longer needs to cover provisioning; it is back
# to meaning just "stop wasting money once the work is done".
IDLE_MIN=15
STARTUP_GRACE_MIN=60
POLL_SEC=30

# Value for each created pod's own RUNPOD_API_KEY env var -- same RunPod
# Secret reference as input/nli_pods.conf (see that file's comment for why
# its name doesn't describe an NLI pod).
POD_ENV_RUNPOD_API_KEY='{{ RUNPOD_SECRET_TEI-RUNPOD-API }}'

# How long (seconds) to poll each new pod's /health before giving up.
HEALTH_TIMEOUT_SEC=600
HEALTH_POLL_INTERVAL_SEC=10

# Delay (seconds) between successive pod-creation calls. Only matters once
# -n > 1 is actually used.
CREATE_DELAY_SEC=5

# Partial availability. Ten L4s in SECURE is a much bigger ask than three, and
# this conf's own GPU note records L4 being unavailable at least once already.
# create_pods.sh no longer aborts on the first creation failure: it keeps going
# (up to MAX_CONSECUTIVE_CREATE_FAILURES in a row), then reports whichever pods
# DID come up and writes hosts.generated.yaml from those only. MIN_READY is the
# floor below which the run is treated as a failure rather than a partial.
# Exit status: 0 = all requested, 2 = partial, 1 = below MIN_READY / none.
MIN_READY=4
MAX_CONSECUTIVE_CREATE_FAILURES=3
