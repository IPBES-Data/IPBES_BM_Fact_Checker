# Number of parallel workers for mclapply-based targets.
# Falls back to 1 on Windows (mclapply does not fork there).
#
# NOT under collection: -- it is read only by the factcheck project
# (claim_work_pairs' cross-join). The collection pipeline passes its own
# literal `workers = 8` to download_works().
workers: 8

# ---------------------------------------------------------------------------
# COLLECTION -- everything the `collection` targets project needs, and nothing
# else. Named for the project in _targets.yaml, matching output/collection/.
#
# Commenting an assessment out here removes it from EVERY project, since
# `assessments:` is the source list the others filter. That is what scopes the
# pipeline today: only GA1 is live, and the other four were archived to
# deep_archive/ on 2026-10-07. Re-enabling one means uncommenting it here AND
# adding it back to the relevant `reports:` entries -- generate_report_wrappers()
# hard-stops if a report names an assessment absent from this list.
collection:

  # SPARQL endpoint to use for queries.
  # "fuseki" = start a local Fuseki server automatically (brew install fuseki).
  # Any URL = query that endpoint directly (e.g. a remote SPARQL endpoint).
  sparql_url: fuseki

  assessments:
    - id: GA1
      ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/main/Global%20Assessment%201/GA1_v09.ttl
      full_text: false
    # - id: VA
    #   ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Values%20Assessment/VA_v05.ttl
    #   full_text: false
    # - id: TCA
    #   ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Transformative%20Change%20Assessment/TCA_v02.ttl
    #   full_text: false
    # - id: IAS
    #   ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Invasive%20Alien%20Species%20Assessment/IAS_v05.ttl
    #   full_text: true
    # - id: BBA
    #   ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Business%20and%20Biodiversity%20Assessment/BBA_v01.ttl
    #   full_text: true

# Which reports to render, and over which dimensions.
#
# Consumed by generate_report_wrappers() (R/generate_report_wrappers.R), which
# is called from _targets_collection.R's preamble -- BEFORE the pipeline is defined -- and
# writes one small wrapper .qmd per combination into input/reports/. Each
# wrapper is a params: block plus a {{< include _<qmd_name>_body.qmd >}}, and
# the Quarto project (input/reports/_quarto.yml) then renders them all.
#
# Generation has to happen in the preamble because tarchetypes::tar_quarto()
# inspects the project and resolves its dependency edges when _targets_collection.R is
# SOURCED, not when the target runs -- a wrapper produced by an upstream target
# would contribute nothing on the run that created it.
#
# `qmd_name` names the shared body and prefixes every generated wrapper.
# `title` is a template; {...} placeholders are filled from that wrapper's own
# parameter values. Every other key lists the values of one dimension to expand
# over, and the generator takes the Cartesian product of whichever keys are
# present. Omit a dimension and it is derived (granularity defaults to all
# three; nli_config is resolved per granularity by nli_config_for_granularity(),
# which is the safe default -- naming the wrong config silently makes
# already-scored data look unscored).
#
# `label` is deliberately NOT a key here: the funnel report always expands over
# both REFUTES and SUPPORTS, which is what collapses the two former
# byte-for-byte twin targets into the single entry below.
#
# Adding an assessment therefore means updating BOTH `assessments:` above and
# the relevant entries here. That is deliberate -- until now the set of rendered
# reports was an accident of which data happened to exist on disk.

# ---------------------------------------------------------------------------
# Purpose blocks: scope + selection.
#
# `nli:` and `llm_verification:` below are LIBRARIES of named definitions and
# select nothing. Each pipeline picks what it uses here, because "active" is a
# single global answer to a question every project answers for itself, and they
# need not agree on the model. While there was one DAG the conflation was
# invisible; once the pipeline was split it is wrong.
#
# Only `fact_checking:` remains -- `training:` was retired 2026-10-05 -- so the
# machinery is currently carrying one selection. It is kept because the
# distinction is what stops a second purpose silently inheriting the first's
# model, which is exactly how the two would drift apart.
#
# Scope lives here too, rather than as per-assessment flags inside
# `assessments:`. Flags there would change `assessments_list`'s value and so
# invalidate `assessment`, and with it ttl_path, works_parquet,
# snowball_parquet and everything downstream -- days of OpenAlex time. A
# purpose block avoids that hazard instead of defusing it.
#
# Resolved and validated by purpose_config() in R/branch_helpers.R: a name that
# is not in the corresponding library is a hard error, because it would
# otherwise read as "nothing has been scored yet" and re-dispatch a corpus at
# real GPU cost.
# ---------------------------------------------------------------------------

# _targets_factcheck.R -- the citing-works corpus. This is the expensive arm
# (millions of pairs, GPU hours, real OpenRouter spend), so it is scoped to the
# assessment actually being worked on. Widen it here when another is ready to
# be scored. Note the other four assessments were archived to deep_archive/ on
# 2026-10-07 and are commented out of `collection: assessments:` entirely, so
# widening means uncommenting there first.
#
# A LIBRARY plus an `active:` selection, the same shape `nli:` and
# `llm_verification:` already use. One pipeline, one selection -- running every
# config would multiply GPU and OpenRouter spend by the number of definitions,
# and each distinct model needs its own pod pool anyway, because a pool serves
# one model per deployment. (purpose_config() still accepts the older flat
# shape, which is why restoring a second purpose block is additive.)
#
# km: scopes scoring to one or more Key Messages, and OMITTING IT MEANS ALL --
# the pre-existing behaviour, so an entry without it is unchanged. GA1 has 4 KMs
# over 39 BMs, so naming one is roughly a 4x cut in both arms. The strings are
# matched literally against key_messages_parquet and validated at runtime by
# build_claim_units(), which stops naming the offender: they are
# per-assessment and inconsistent ("A." in GA1, "KM-A1" in IAS, "KM1" in VA /
# TCA / BBA), and "A" for "A." would otherwise enumerate zero claims and look
# like a successful no-op. The filter operates on the (km, bm) PAIR, not on km
# alone -- outside GA1 a BM can sit under several KMs.
#
# Narrowing the scope computes less; it never deletes what is out of scope. The
# three stages that used to wipe their output wholesale before writing
# (consolidate_claim_scores, relevance_screen, llm_verification) are all additive
# now, so widening again costs only the pairs that were never scored.
fact_checking:
  active: ga1_jev

  # ---- relevance screen -------------------------------------------------
  # Moved in here on 2026-10-07. It used to sit at the top level because the
  # single `threshold:` applied to BOTH purposes -- fact_checking and training
  # -- which wanted different answers. `training:` was retired 2026-10-05, so
  # there is only one purpose left and the setting belongs to it.
  relevance_screen:
    model: typesafe/jev-1.13

    # ~ means the screen SCORES but never filters -- nothing is dropped.
    #
    # A dropped pair never reaches Phase 2, so it never gets a verdict, and it
    # leaves NO trace: no failed quote check, nothing to audit. That is the one
    # failure mode here with no error and no signal, which is why this stays
    # off until validated against human labels. Measured on the train fold
    # (sparing NOT_ENOUGH_INFO, since irrelevance IS that label):
    #
    #   threshold   REFUTES   SUPPORTS   per-class cap   training rows
    #   ~ (off)         489      1,568             489           1,467
    #   0.3             303      1,192             303             909
    #   0.5             127        753             127             381
    threshold: ~

  configs:
    # Jev as Phase 1. KM C. is the scope the two retired NLI backends also
    # scored, so all three stay directly comparable on 2,307,101 identical
    # pairs. ~$115 citing works + ~$1.50 key papers.
    #
    # ⚠ Those two backends' scores are STILL ON DISK and still read, under
    # scorer_config=bge_m3_ft_ga1 and scorer_config=bge_m3_zeroshot_atomic_bm.
    # Their config entries are gone from `nli.configs` below, so nothing
    # config-driven can address them and they look safe to archive -- but
    # build_goldstandard_sample() names them in its own `scorer_configs`
    # default and inner-joins all three to build the frame the human review
    # round draws from. goldstandard_read_scores() stop()s if either is
    # missing. Do not move them until that round is finished.
    ga1_jev:
      assessments: [GA1]
      km: ["C."]
      nli: jev_atomic_bm
      llm: openrouter_cheap
      claim_completion: haiku_completion
# The `training:` purpose block was removed on 2026-10-05 (branch `Jev`). The
# fine-tuning arm it selected for had no subject once the NLI stopped being the
# first-stage filter -- see design_notes.md points 3, 6, 7, 8. Its two halves
# that were never training moved into `factcheck`: the key-paper QA chain (does
# a BM's own cited evidence support it?) and the gold standard.
#
# purpose_config() still accepts the flat shape this block used, so restoring
# it is adding it back; nothing in R/ was narrowed. The `NLI_dirty` branch
# holds the state before.

reports:
  - qmd_name: IPBES_Label_Funnel_Report
    title: "{label} - {assessment} ({granularity})"
    assessment: [GA1]
    granularity: [naive_bm, complete_bm, atomic_bm]

  - qmd_name: QA_BM_Split_Report
    title: "QA BM Split - {assessment} ({granularity})"
    assessment: [GA1]
    granularity: [naive_bm, complete_bm, atomic_bm]

  - qmd_name: QA_NLI_Scores_Report
    title: "QA NLI Scores - {assessment} ({granularity})"
    assessment: [GA1]
    granularity: [naive_bm, complete_bm, atomic_bm]

  - qmd_name: QA_LLM_Verification_Report
    title: "QA LLM Verification - {assessment}"
    assessment: [GA1]
    llm_config: [openrouter_cheap]

# Phase 1 scorer backends. A config's `backend:` selects the scorer:
# `jev` routes to score_one_claim_jev() (R/score_one_claim_jev.R). Switch
# models by changing `nli:` in the purpose block above to a key under
# `configs`. Use `~` to disable.
#
# ONE backend exists on this branch. The RunPod zero-shot pool
# (bge-m3-zeroshot-v2.0-c), its GA1 fine-tune and the deberta configs before
# them were retired on 2026-10-05: measured against refutations confirmed by
# three independent reviewers they scored AUC 0.50 for REFUTES and 0.38 for
# SUPPORTS -- chance and below. _targets_factcheck.R hard-stops on any config
# whose backend is not `jev`. The remnants live on the `NLI_dirty` branch;
# see design_notes.md points 3 and 5-8.
#
# granularity: how a BM's bm_description/bm_label text is cut into claims --
#   "naive_bm" -- evidence-delimited sub-claims (segment_bm_by_evidence(),
#     2-17 per BM). NOT active and never scored: no naive_bm scores exist for
#     any assessment, and its GA1 premise corpus was archived 2026-10-07;
#     output would partition under
#     output/factchecker/claim_work_pairs/granularity=naive_bm/ and
#     output/factchecker/claim_scores/granularity=naive_bm/.
#   "complete_bm" -- each field taken whole, un-segmented (segment_bm_whole()):
#     2 claims per BM (bm_description + bm_label), or 1 if the two fields are
#     identical after whitespace normalization. Measured ~71% fewer scored pairs
#     combined across GA1+IAS (3,582,329 -> ~1,049,572) -- see
#     TD_BM_NLI_approach.qmd for the full table. The caveat recorded there --
#     that a whole-field claim can exceed a model's own position-embedding
#     limit and truncate the CLAIM rather than the premise -- applied to the
#     retired 512-token deberta configs; the decisions API chunks by a token
#     budget instead, so it does not arise here.
#     Output partitioned under .../granularity=complete_bm/.
# granularity: atomic_bm's LLM-completion step (R/build_claim_completion.R):
# resolves elliptical fragments from segment_bm_atomic()'s per-brace split
# into self-contained claims. Tiny volume -- 656 real fragments actually
# need a call (computed directly against all 88 BMs across both
# assessments; single-fragment BM fields skip the LLM entirely), so this
# is picked for completion quality/instruction-following on a strict
# "never invent new content, only restore grammar" rewriting task, not
# cost -- every real candidate model priced out under $1 total for the
# whole one-time job. claude-haiku-4.5 chosen for its strong track record
# on precise, constrained rewriting instructions; not empirically
# A/B-tested against alternatives the way gpt-oss-20b was for Phase 2
# verification earlier -- swap `claim_completion:` in the purpose blocks
# above if that's ever done.
claim_completion:
  configs:
    haiku_completion:
      model: "anthropic/claude-haiku-4.5"

nli:
  configs:
    # Jev as PHASE 1, not as the screen it currently is one stage further down.
    #
    # backend: jev switches score_one_claim() out for score_one_claim_jev()
    # (R/score_one_claim_jev.R). Three typed questions per pair --
    # supports / contradicts / bears-on-the-claim, in
    # input/prompts/jev_claim_questions.json -- cross-normalised into
    # (p_supports, p_refutes, p_nei). That is the same operation `passes: 3`
    # already performs for the zero-shot head, so the output schema,
    # uncertain_threshold, the nli_route= partitions and every report
    # downstream are untouched.
    #
    # It writes its own scorer_config= tree, so the retired backends' scores
    # on the same rows stay available for comparison. Every measurement
    # behind the switch comes from models judging models and the human
    # review round has not happened. See design_notes.md points 6 and 8.
    #
    # Measured 2026-10-05 against refutations confirmed by three independent
    # reviewers: AUC 0.737 [0.63, 0.84] where the zero-shot NLI scores 0.529,
    # and 0.95 vs 0.38 for SUPPORTS.
    #
    # Cost: ~$0.00005/pair, so ~$121 for GA1's 2.43M citing-work pairs and
    # ~$1.50 for its 29,511 key-paper pairs. No pod, no GPU, no host list --
    # concurrency is per-request inside the scorer.
    jev_atomic_bm:
      backend: jev
      model: typesafe/jev-1.13
      # Label vocabulary and threshold kept identical to the zero-shot configs
      # so the two are directly comparable; nothing reads candidate_labels in
      # this backend (the question file defines the three slots) but it is left
      # in as the record of what the columns mean.
      candidate_labels: ["supports", "refutes", "is not relevant to"]
      uncertain_threshold: 0.60   # UNCALIBRATED for this model -- carried over so the comparison is like-for-like, not because it is right. Calibrate against human labels.
      granularity: atomic_bm
      max_length: 2048            # advisory only: the decisions API chunks by a token BUDGET, it does not truncate per pair

# Phase 2 — LLM verification of NLI-flagged pairs (see TD_NLI_LLM_two_phase.qmd
# and R/build_llm_verification_parquet.R). One ellmer::chat_openrouter() call
# per (claim, work) pair via OpenRouter. Switch models by changing `llm:` in a
# purpose block above to a key under `configs`, same pattern as `nli:` there.
#
# max_active and max_tokens are carried over unchanged from the sibling
# Categorisation_Literature project's proven epistemology-classifier configs
# (input/config.yaml's `epistemology:` block there), not re-derived from this
# schema's smaller field count:
#   - max_active: 24 concurrent OpenRouter requests was the value actually run
#     at ~2,800-call scale there without hitting rate limits.
#   - max_tokens: 8000 is a cap, not a reservation -- unused tokens are not
#     billed. It matters on REASONING models (gpt-5, gemini-2.5-pro): thinking
#     tokens are billed against the same budget as the visible JSON, and
#     leaving it too low there truncated responses mid-JSON in the sibling
#     project even though this schema's own visible output (four short
#     scalar fields) needs far less than 8000 on a non-reasoning model like
#     gpt-4o-mini. Lower it per-config if measured usage justifies it; there
#     is no cost pressure to do so pre-emptively.
#
# nli_labels: which NLI label(s) this config routes -- null/omitted (any
#   label, no filter) or one/more labels, e.g. [REFUTES], [REFUTES, SUPPORTS].
# nli_certainty: which confidence band(s) -- null/omitted (any), or one/more
#   of "certain" (uncertain == FALSE) / "uncertain" (uncertain == TRUE), e.g.
#   certain, or [certain, uncertain] (equivalent to null, spelled out).
# Combined with AND: nli_labels: [REFUTES, SUPPORTS], nli_certainty: certain
# routes every high-confidence REFUTES or SUPPORTS pair (measured: 26,861
# REFUTES-certain + 52,061 SUPPORTS-certain = 78,922 of 3,547,231 scored
# pairs, ~$11.75 combined at gpt-4o-mini rates) -- REFUTES-certain alone was
# the original first step; SUPPORTS-certain was added once the REFUTES
# funnel report (IPBES_Label_Funnel_Report.qmd) was generalized to cover
# both labels. Broader sets (either label at any confidence, or adding
# NOT_ENOUGH_INFO when uncertain: 2,357,718 pairs for the original
# REFUTES-only design) are left for later by widening either field or
# defining additional configs. Output is hive-partitioned by
# nli_route=<LABEL>-<certainty> too -- but that value is derived PER ROW
# from its own actual label/uncertain outcome, not from these filter
# fields, so a config listing several labels or certainties still splits
# its output across one partition per outcome actually present (e.g.
# nli_labels: [REFUTES, SUPPORTS] produces nli_route=REFUTES-certain AND
# nli_route=SUPPORTS-certain as separate partitions, not one merged one).
#
# Every config reviews ALL citing works found under the claim's BM -- there
# is no candidate-narrowing lever anymore (retired: real measured reduction
# was only ~14% for GA1 atomic_bm, not worth the matching/drift-check
# machinery it cost to maintain). Instead, each scored row is TAGGED with
# `direct_evidence_match` -- TRUE if that citing work traces back, via the
# snowball citation graph, to a seed reference whose refs_parquet `sm`
# matches THIS claim's own evidence-reference sub-chapter(s) (e.g. {5.4.1}),
# FALSE otherwise (including every row when the claim has no evidence braces
# at all, or under `complete_bm`, whose whole-field claims carry no
# per-sub-claim evidence tokens to match against in the first place). See
# R/build_llm_candidate_scope_parquet.R (the matching computation, unchanged
# from when it fed a filter) and R/build_llm_verification_parquet.R (where
# the tag is now attached) for the full design.
llm_verification:
  configs:
    # Default: cheap, fast, non-reasoning. First step: high-confidence
    # REFUTES/SUPPORTS.
    openrouter_cheap:
      model: "openai/gpt-4o-mini"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain

    # Step up when the cheap model is topic-matching rather than actually
    # judging the claim (spot-check the `quote`/`explanation` columns).
    openrouter_midtier:
      model: "google/gemini-2.5-flash"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain

    # For a final, citable verification pass. Reasoning model -- see the
    # max_tokens note above for why it still needs the full 8000 despite the
    # small visible schema.
    openrouter_toptier_gpt5:
      model: "openai/gpt-5"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain
