name: Deploy report to GitHub Pages

# Triggered by scripts/deploy_gh_pages.sh pushing a fresh output/reports/
# snapshot to the `reports` branch. That branch holds only the already-
# rendered static site (no source code, no .gitmodules) — the report
# itself can't be built here, since tar_make() needs RunPod API keys,
# GPU-backed NLI scoring, and OpenAlex/Zotero network access this runner
# doesn't have; it always runs locally. This workflow's only job is to
# copy that content into the gh-pages branch, which GitHub Pages is
# configured to serve from directly (Settings > Pages > "Deploy from a
# branch": gh-pages, /).
#
# A plain git push into gh-pages, not actions/deploy-pages: that action
# deploys through the repo's "github-pages" protected Environment, whose
# default branch policy doesn't allow `reports` to deploy — and it isn't
# needed here anyway, since Pages is in branch-source mode, not
# Actions-source mode.
on:
  push:
    branches: [reports]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports (source content)
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports

      - name: Checkout gh-pages (publish target)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync reports/ into gh-pages/
        run: rsync -a --delete --exclude='.git' reports/ gh-pages/

      - name: Commit and push if changed
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin gh-pages
